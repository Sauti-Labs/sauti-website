name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Install, Type Check, Lint, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # No test step yet: this repository has no test suite. Per
      # docs/architecture.md, tests/components/ and tests/e2e/ are
      # introduced once there is something real to test. A Test step
      # will be added here, between Lint and Build, once a real test
      # command exists in package.json. See
      # docs/milestones/M001-repository-foundation.md for current status.
